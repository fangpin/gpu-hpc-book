<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPU 高性能计算</title>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="assets/site.css">
  </head>
  <body>
    <div id="app">加载中...</div>
    <script>
      window.$docsify = {
        name: 'GPU 高性能计算',
        repo: 'https://github.com/fangpin/gpu-hpc-book',
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        relativePath: true,
        plugins: [
          function sidebarCurrentChapterPlugin(hook) {
            function normalizePath(pathname) {
              return pathname
                .replace(/^#/, '')
                .replace(/[?#].*$/, '')
                .replace(/^\/+/, '');
            }

            function currentPagePath() {
              var hash = window.location.hash || '';
              var hashPath = hash.replace(/^#\/?/, '').split('?')[0];
              return normalizePath(hashPath || 'README.md');
            }

            function updateSidebarCurrentChapter() {
              var sidebar = document.querySelector('.sidebar-nav');
              if (!sidebar) {
                return;
              }

              var current = currentPagePath();
              sidebar.querySelectorAll(':scope > ul > li').forEach(function markChapter(item) {
                var chapterLink = item.querySelector(':scope > a');
                var chapterPath = chapterLink
                  ? normalizePath(chapterLink.getAttribute('href') || '')
                  : '';
                item.classList.toggle('is-current-chapter', Boolean(chapterPath) && chapterPath === current);
              });
            }

            hook.mounted(updateSidebarCurrentChapter);
            hook.doneEach(updateSidebarCurrentChapter);
          }
        ],
        search: {
          noData: '没有结果',
          paths: 'auto',
          placeholder: '搜索文档'
        }
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-latex@0/dist/docsify-latex.min.js"></script>
  </body>
</html>
